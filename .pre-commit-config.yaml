# .pre-commit-config.yaml
# Pre-commit configuration using ruff for linting and formatting.
# To use pre-commit:
# $ pip install pre-commit  # or: uv pip install pre-commit
# $ pre-commit install

default_language_version:
  python: python3

repos:
  # Ruff: replaces black, flake8, and isort in a single fast tool
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      # Ruff formatter (replaces black)
      - id: ruff-format
        exclude: ^docs/|^tutorial/

      # Ruff linter (replaces flake8 + isort)
      - id: ruff
        name: ruff (lint + fixes)
        args: ["--fix"]
        exclude: ^docs/|^tutorial/

  # Blackdoc: format code examples in docstrings
  - repo: https://github.com/keewis/blackdoc
    rev: v0.4.6
    hooks:
      - id: blackdoc
        additional_dependencies: ["black>=24.10.0"]
        exclude: ^docs/|^tutorial/

  # MyPy: static type checker
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies:
          - "alembic>=1.5.0"
          - "colorlog"
          - "numpy"
          - "packaging>=20.0"
          - "sqlalchemy>=1.3.0"
          - "tqdm"
          - "PyYAML"
          - "mypy_boto3_s3"
          - "types-PyYAML"
          - "types-redis"
          - "types-setuptools"
          - "types-tqdm"
          - "typing_extensions>=3.10.0.0"
        exclude: ^docs/|^tutorial/
        args:
          - --warn-unused-configs
          - --disallow-untyped-calls
          - --disallow-untyped-defs
          - --disallow-incomplete-defs
          - --check-untyped-defs
          - --no-implicit-optional
          - --warn-redundant-casts
          - --strict-equality
          - --extra-checks
          - --no-implicit-reexport
          - --ignore-missing-imports
          - --enable-incomplete-feature=NewGenericSyntax