# Build system configuration
[build-system]
requires = ["setuptools >= 61.1.0", "wheel"]
build-backend = "setuptools.build_meta"

# Project metadata
[project]
name = "LLM_utils"
description = "A description of the project"
readme = "README.md"
authors = [
  {name = "Your Name"}
]

requires-python = ">=3.12"
dynamic = ["version"]

dependencies = [
  "colorlog==6.10.1",
  "numpy==2.3.4",
  "packaging==25.0",
  "tqdm==4.67.1",
  "PyYAML==6.0.3",
  "openai==2.4.0",
  "tiktoken==0.12.0",
  "transformers==4.57.1",
  "anthropic==0.71.0",
  "litellm==1.80.0",
  "tenacity==9.1.2",
]

[project.optional-dependencies]
checking = [
  "ruff>=0.14.0",
  "blackdoc>=0.3.10",
  "mypy",
  "mypy_boto3_s3",
  "types-PyYAML",
  "types-redis",
  "types-setuptools",
  "types-tqdm",
  "typing_extensions>=3.10.0.0",
  "pre-commit",
  "pytest",
]

document = [
  "ase",
  "cmaes>=0.10.0",
  "fvcore",
  "kaleido<0.4",
  "lightgbm",
  "matplotlib!=3.6.0",
  "pandas",
  "pillow",
  "plotly>=4.9.0",
  "scikit-learn",
  "sphinx",
  "sphinx-copybutton",
  "sphinx-gallery",
  "sphinx_rtd_theme>=1.2.0",
  "torch",
  "torchvision",
]

[project.urls]
homepage = "https://example.com"
repository = "https://example.com/repository"
documentation = "https://example.com/documentation"
bugtracker = "https://example.com/bugtracker"

# Directories to include in the package distribution
[tool.setuptools.packages.find]
include = ["LLM_utils*"]

# Dynamically determines the version of the package
[tool.setuptools.dynamic]
version = {attr = "LLM_utils.version.__version__"}

# specifies additional non-Python files that should be included in the package
# [tool.setuptools.package-data]
# "LLM_utils" = [
#   "py.typed",
# ]

# ---- uv-specific: map certain packages to custom indexes ----
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

# Uncomment if you need PyTorch with CUDA support
# [[tool.uv.index]]
# name = "pytorch-cu128"
# url = "https://download.pytorch.org/whl/cu128"

# [tool.uv.sources]
# torch = { index = "pytorch-cu128" }

# Configuration for Ruff (replaces black, flake8, and isort)
[tool.ruff]
line-length = 99
target-version = "py312"
respect-gitignore = true
exclude = [
  ".venv",
  "venv",
  "build",
  "tutorial",
  ".asv",
  "docs",
  "docs/visualization_examples",
  "docs/visualization_matplotlib_examples",
]

[tool.ruff.lint]
# E, F, W: Flake8-equivalent rules
# I: isort-equivalent import sorting
# UP: pyupgrade for modern Python syntax
select = ["E", "F", "W", "I", "UP"]
# E203: Whitespace before ':' (conflicts with black-style formatting)
# E501: Line too long (handled by formatter)
ignore = ["E203", "E501"]

[tool.ruff.lint.isort]
force-single-line = true
force-sort-within-sections = true
order-by-type = false
lines-after-imports = 2

[tool.ruff.format]
line-ending = "auto"

# Configuration for blackdoc
[tool.blackdoc]
exclude = "docs"

# Configuration for MyPy (moved from setup.cfg)
[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
strict_equality = true
extra_checks = true
no_implicit_reexport = true
ignore_missing_imports = true
exclude = ["docs", "tutorial"]

# Configuration for Pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-s -q -o log_cli=true --log-cli-level=INFO --color=yes"
log_cli = true
log_cli_level = "INFO"